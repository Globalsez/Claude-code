<!doctype html>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; overflow:hidden; position:relative;
    font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(80% 100% at 100% 0%, rgba(52,180,171,.55) 0%, rgba(52,180,171,0) 60%),
      radial-gradient(70% 90% at 0% 100%, rgba(217,138,102,.45) 0%, rgba(217,138,102,0) 60%),
      linear-gradient(150deg,#F8F1E7 0%, #FDFAF5 55%, #F0E4D3 100%);
    color:#2E241E; display:flex; align-items:center;
  }
  .copy { padding:0 0 0 84px; width:700px; }
  .eyebrow {
    display:inline-flex; align-items:center; gap:12px;
    font-size:16px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:#0E7470;
  }
  .eyebrow::before { content:""; width:34px; height:2px; background:#C4674A; }
  h1 {
    font-family:"Fraunces","Iowan Old Style",Georgia,serif; font-weight:600;
    font-size:82px; line-height:1.04; letter-spacing:-.02em; margin:26px 0 0;
  }
  h1 em { font-style:italic; color:#C4674A; font-variation-settings:"SOFT" 40,"WONK" 1; }
  p.sub { font-size:25px; line-height:1.45; color:#574539; margin-top:26px; max-width:19em; }
  .firm {
    position:absolute; left:84px; bottom:56px;
    display:flex; align-items:center; gap:14px;
    font-size:19px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#7A6656;
  }
  .firm span::before { content:""; }
  .arch {
    position:absolute; right:-40px; top:50%; transform:translateY(-50%);
    width:430px; height:530px;
    border-radius:50% 50% 34px 34px / 42% 42% 34px 34px;
    background:linear-gradient(165deg,#6BCFC6,#17968F 55%,#2C4739);
    box-shadow:0 30px 70px rgba(46,36,30,.22);
    display:grid; place-items:center; text-align:center;
  }
  .arch::after {
    content:""; position:absolute; inset:0; border-radius:inherit;
    background:radial-gradient(70% 50% at 50% 0%, rgba(255,255,255,.3), transparent 60%);
  }
  .arch-inner { position:relative; z-index:1; color:#fff; padding:34px; }
  .arch-inner p {
    font-family:"Fraunces",Georgia,serif; font-size:31px; line-height:1.25; margin-top:20px; max-width:11em;
  }
  .arch-inner small { display:block; margin-top:16px; font-size:16px; color:rgba(255,255,255,.82); }
</style>
<div class="copy">
  <span class="eyebrow">Republic of Seychelles</span>
  <h1>Your documents,<br><em>recognised everywhere.</em></h1>
  <p class="sub">Apostille &amp; legalisation, lodged at the Supreme Court and couriered worldwide.</p>
</div>
<div class="firm"><svg width="34" height="34" viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="11" fill="#17968F"/><path d="M24 8c6 5.5 9 10.5 9 16a9 9 0 1 1-18 0c0-5.5 3-10.5 9-16Z" fill="#F8F1E7"/><path d="M24 16c2.6 2.6 4 5 4 8a4 4 0 1 1-8 0c0-3 1.4-5.4 4-8Z" fill="#C4674A"/><path d="M10 38c4-2.5 7-2.5 11 0 4 2.5 7 2.5 11 0" stroke="#D9A441" stroke-width="2.6" stroke-linecap="round"/></svg><span>Apostille Seychelles &middot; Victoria Law Firm</span></div>
<div class="arch"><div class="arch-inner">
  <svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto"><circle cx="12" cy="9" r="5"/><path d="m8.5 13.5-1 7.5L12 19l4.5 2-1-7.5"/></svg>
  <p>Issued by the Supreme Court of Seychelles</p>
  <small>Hague Apostille Convention, 1961</small>
</div></div>
